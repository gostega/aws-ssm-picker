name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build & release binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          binary=aws-ssm-picker
          [ "$GOOS" = "windows" ] && binary=aws-ssm-picker.exe
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags="-s -w -X main.Version=${version} -X main.Commit=$(git rev-parse --short HEAD)" \
            -o "dist/$binary" .

      - name: Archive
        run: |
          cd dist
          base="aws-ssm-picker_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "${base}.zip" aws-ssm-picker.exe
            rm aws-ssm-picker.exe
          else
            tar -czf "${base}.tar.gz" aws-ssm-picker
            rm aws-ssm-picker
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
